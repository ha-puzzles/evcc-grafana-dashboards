# Configuration options for the evcc-vm-aggregate.sh script. Must be located in the same directory as the script.


### VICTORIA METRICS DATABASE CONFIGURATION ###

# User name of the VictoriaMetrics DB. Empty, if no user is required. Default: ""
VM_USER="" 

# Password of the VictoriaMetrics DB user. Default: ""
VM_PASSWORD="" 

# If the script is run remotely, enter the host name of the remote host. Default: "localhost"
VM_HOST="localhost" 

# The port to connect to VictoriaMetrics. Default: 8428
VM_PORT=8428 


### PV CONFIGURATION ###

# Absolute limit in W for valid power readings (both signs). Default: 40000
PEAK_POWER_LIMIT=40000 

# Set to false in case your home does not use a battery.
HOME_BATTERY="true"

# Set to true to collect tariff history.
DYNAMIC_TARIFF="true" 


### GENERAL CONFIGURATION ###

# Time zone as in TZ identifier column here: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones#List
# Calendar days use this timezone explicitly, including 23/25-hour DST days.
# Use the same timezone for displaying the Grafana dashboard.
TIMEZONE="`cat /etc/timezone`" 

# Raw samples are averaged in these intervals, then integrated by trapezoids.
# Must divide one hour and be <= 1h. Default: "60s" for EVCC sampling every 30s.
ENERGY_SAMPLE_INTERVAL="60s"

# Interval of grid tariff price updates. Must be a multiple of ENERGY_SAMPLE_INTERVAL. Default: "15m".
# If for example your grid tariff changes in intervals of 60 minutes, change this to "1h".
# If you have static grid prices that do not change over the day, set this to "1d".
TARIFF_PRICE_INTERVAL="15m"

# Set to true to generate debug output. 
DEBUG="false" 